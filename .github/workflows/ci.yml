name: Inventor Automation CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Formatting
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check code formatting with Black
      run: |
        black --check --line-length=100 src/ tests/

    - name: Lint with Flake8
      run: |
        flake8 src/ tests/ --count --max-line-length=120 --statistics

    - name: Validate sample BOM schemas (JSON & YAML)
      run: |
        python -c "from src.core.bom_processor import BomProcessor; p = BomProcessor(); p.parse_file('config/sample_bom.json'); p.parse_file('config/sample_assembly_bom.json'); p.parse_file('config/sample_machined_parts.yaml'); print('All sample BOM specifications successfully validated.')"

  test:
    name: Mock COM Test Suite (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run test suite with pytest & coverage
      run: |
        pytest -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage artifact
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
